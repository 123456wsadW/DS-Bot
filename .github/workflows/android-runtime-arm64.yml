name: Build Android ARM64 Linux runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for public HTTPS runtime download
        required: true
        default: android-runtime-v0.1.0
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - 'ds-bot/**'
      - 'scripts/build-android-runtime.sh'
      - '.github/workflows/android-runtime-arm64.yml'

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build official DS Bot image for ARM64
        run: |
          docker buildx build --platform linux/arm64 --load -f docker/Dockerfile -t ds-bot:android-arm64 .
      - name: Export image and assemble PRoot runtime
        run: |
          cid=$(docker create ds-bot:android-arm64)
          mkdir -p runtime/rootfs
          docker export "$cid" | tar -xpf - -C runtime/rootfs
          docker rm "$cid"
          bash scripts/build-android-runtime.sh runtime
      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: ds-bot-linux-arm64-runtime
          path: dist/ds-bot-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Publish checksum
        run: sha256sum dist/ds-bot-linux-arm64.tar.gz

      - name: Publish runtime release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: DS Bot Android runtime ${{ inputs.release_tag }}
          files: |
            dist/ds-bot-linux-arm64.tar.gz
            dist/ds-bot-linux-arm64.tar.gz.sha256
