name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for the debug APK
        required: true
        default: android-debug-v0.1.0
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - 'docker/**'
      - 'ds-bot/**'
      - 'scripts/build-android-runtime.sh'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Bundle JavaScript into debug APK
        working-directory: mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          m = re.search(r'(?m)^react\s*\{', s)
          if not m:
              raise SystemExit("React Native Gradle react { } block not found")
          insert = m.end()
          s = s[:insert] + "\n    debuggableVariants = []" + s[insert:]
          p.write_text(s)
          print("Configured React Native to bundle JS for debug variant")
          PY
      - name: Build embedded ARM64 Linux runtime
        run: |
          docker buildx build --platform linux/arm64 --load -f docker/Dockerfile -t ds-bot:android-arm64 .
          cid=$(docker create ds-bot:android-arm64)
          mkdir -p runtime/rootfs
          docker export "$cid" | tar -xpf - -C runtime/rootfs
          docker rm "$cid"
          bash scripts/build-android-runtime.sh runtime
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Copy runtime into APK assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp dist/ds-bot-linux-arm64.tar.gz mobile/android/app/src/main/assets/runtime.tar.gz
          cp dist/ds-bot-linux-arm64.tar.gz.sha256 mobile/android/app/src/main/assets/runtime.tar.gz.sha256
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ds-bot-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'android-debug-latest' }}
          name: DS Bot Android APK (Latest)
          target_commitish: ${{ github.sha }}
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

# Debug APKs must embed index.android.bundle; otherwise React Native tries to contact Metro.
