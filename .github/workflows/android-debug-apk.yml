name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for the debug APK
        required: true
        default: android-debug-v0.1.0
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ds-bot-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: DS Bot Android APK ${{ inputs.release_tag }}
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
